<!doctype html>
<!-- A row of phone screenshots with captions, for the README.
     strip.html?s=today,player,live&t=Title|Title|Title&d=Sub|Sub|Sub
     Rendered by scripts/readme_images.mjs -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  .card { margin: 0; padding: 44px 40px 40px; border-radius: 36px; display: flex; gap: 36px; justify-content: center;
    background: radial-gradient(circle at 50% 0%, #252B40 0%, #161A24 45%, #0F1115 85%); width: max-content; }
  figure { margin: 0; width: 300px; display: flex; flex-direction: column; align-items: center; gap: 18px; font-family: 'DM Sans', sans-serif; }
  .phone { width: 300px; height: 649px; border-radius: 44px; background: #050608; padding: 10px; box-sizing: border-box;
    box-shadow: 0 24px 50px rgba(0,0,0,.5), 0 0 0 2px #2A2F3A; }
  .phone img { width: 100%; height: 100%; border-radius: 35px; display: block; object-fit: cover; object-position: top; }
  figcaption { text-align: center; }
  figcaption b { display: block; font: 700 34px 'Barlow Condensed', sans-serif; color: #F2F2EE; letter-spacing: .5px; }
  figcaption span { display: block; margin-top: 6px; color: #A3A8B3; font-size: 18px; line-height: 1.35; }
  figcaption b i { font-style: normal; color: #C8F135; }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
  var q = new URLSearchParams(location.search);
  var shots = q.get('s').split(','), titles = q.get('t').split('|'), subs = q.get('d').split('|');
  document.getElementById('card').innerHTML = shots.map(function (s, i) {
    return '<figure><div class="phone"><img src="../app/' + s + '.png" alt=""></div><figcaption><b>' + titles[i] + '</b><span>' + subs[i] + '</span></figcaption></figure>';
  }).join('');
</script>
</body>
</html>
