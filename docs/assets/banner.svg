<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Workout Tracker Bot: your private Telegram coach">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#10233d"/>
      <stop offset="1" stop-color="#14365c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2836"/>
      <stop offset="1" stop-color="#0e1621"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>

  <!-- soft glow circles -->
  <circle cx="1090" cy="80" r="190" fill="#38bdf8" opacity="0.07"/>
  <circle cx="960" cy="400" r="160" fill="#34d399" opacity="0.06"/>

  <!-- title block -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="72" y="118" font-size="20" font-weight="600" fill="#7dd3fc" letter-spacing="3">SELF-HOSTED TELEGRAM BOT</text>
    <text x="72" y="184" font-size="58" font-weight="800" fill="#f8fafc">Workout Tracker Bot</text>
    <rect x="72" y="204" width="132" height="6" rx="3" fill="url(#accent)"/>
    <text x="72" y="256" font-size="26" fill="#cbd5e1">Your private coach that adapts to you,</text>
    <text x="72" y="292" font-size="26" fill="#cbd5e1">keeps you honest, and runs for years.</text>

    <!-- chips -->
    <g font-size="17" font-weight="600">
      <rect x="72" y="326" width="158" height="40" rx="20" fill="#0f2a44" stroke="#1e4b74"/>
      <text x="151" y="352" text-anchor="middle" fill="#a5f3fc">Adaptive targets</text>
      <rect x="242" y="326" width="148" height="40" rx="20" fill="#0f2a44" stroke="#1e4b74"/>
      <text x="316" y="352" text-anchor="middle" fill="#a5f3fc">Monthly tests</text>
      <rect x="402" y="326" width="128" height="40" rx="20" fill="#0f2a44" stroke="#1e4b74"/>
      <text x="466" y="352" text-anchor="middle" fill="#a5f3fc">Buddy mode</text>
      <rect x="542" y="326" width="132" height="40" rx="20" fill="#0f2a44" stroke="#1e4b74"/>
      <text x="608" y="352" text-anchor="middle" fill="#a5f3fc">100% private</text>
    </g>
  </g>

  <!-- phone -->
  <g filter="url(#shadow)">
    <rect x="860" y="36" width="300" height="420" rx="38" fill="#05090f"/>
    <rect x="872" y="48" width="276" height="400" rx="30" fill="url(#phone)"/>
  </g>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <!-- chat header -->
    <rect x="872" y="48" width="276" height="54" rx="30" fill="#17212b"/>
    <rect x="872" y="78" width="276" height="24" fill="#17212b"/>
    <circle cx="904" cy="76" r="15" fill="url(#accent)"/>
    <text x="904" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1220">W</text>
    <text x="928" y="72" font-size="14" font-weight="600" fill="#e9edf2">Workout Bot</text>
    <text x="928" y="89" font-size="11" fill="#6ab2f2">online</text>

    <!-- message bubble -->
    <rect x="886" y="114" width="248" height="152" rx="14" fill="#182533"/>
    <text x="900" y="138" font-size="13" font-weight="700" fill="#e9edf2">Today's Workout · IN PROGRESS</text>
    <text x="900" y="164" font-size="12" fill="#e9edf2">Push-ups  40/50</text>
    <rect x="900" y="171" width="160" height="7" rx="3.5" fill="#2b3a4a"/>
    <rect x="900" y="171" width="128" height="7" rx="3.5" fill="#34d399"/>
    <text x="900" y="197" font-size="12" fill="#e9edf2">Squats  50/50  ✓</text>
    <rect x="900" y="204" width="160" height="7" rx="3.5" fill="#34d399"/>
    <text x="900" y="230" font-size="12" fill="#e9edf2">Plank  30/60 s</text>
    <rect x="900" y="237" width="160" height="7" rx="3.5" fill="#2b3a4a"/>
    <rect x="900" y="237" width="80" height="7" rx="3.5" fill="#38bdf8"/>
    <text x="1070" y="258" font-size="11" fill="#7f91a4">07:00</text>

    <!-- inline buttons -->
    <rect x="886" y="274" width="248" height="34" rx="10" fill="#22303f"/>
    <text x="1010" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="#e9edf2">Complete All</text>
    <rect x="886" y="314" width="248" height="34" rx="10" fill="#22303f"/>
    <text x="1010" y="336" text-anchor="middle" font-size="13" font-weight="600" fill="#e9edf2">Short on Time (50%)</text>

    <!-- high five bubble -->
    <rect x="886" y="360" width="232" height="54" rx="14" fill="#182533"/>
    <text x="900" y="383" font-size="12" font-weight="700" fill="#fbbf24">Ana sent you a high-five!</text>
    <text x="900" y="402" font-size="12" fill="#cbd5e1">Keep it up · Streak 12 days</text>
  </g>
</svg>
